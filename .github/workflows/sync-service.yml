name: Private sync service
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'tests/cloudflare.test.mjs', 'package*.json', '.github/workflows/sync-service.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
